name: Deploy to GoDaddy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (raíz colbeef.com)
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_WEB3FORMS_TRABAJE_ACCESS_KEY: ${{ secrets.TRABAJE_CON_NOSOTROS }}
          VITE_WEB3FORMS_HORECA_ACCESS_KEY: ${{ secrets.SOLICITUD_DE_NEGOCIO }}

      # Cuenta FTP adicional enjaulada en public_html/colbeef.com (no usar frigofrfadmin).
      # Secrets: FTP_USERNAME (usuario@frigorificoriofrio.com), FTP_PASSWORD
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.frigorificoriofrio.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          security: loose
          timeout: 60000
