name: Deploy to GoDaddy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (raíz colbeef.com)
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_WEB3FORMS_TRABAJE_ACCESS_KEY: ${{ secrets.TRABAJE_CON_NOSOTROS }}
          VITE_WEB3FORMS_HORECA_ACCESS_KEY: ${{ secrets.SOLICITUD_DE_NEGOCIO }}

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # No usar ~/.netrc: contraseñas con @ ! rompen el parseo.
      # Destino: el home de la cuenta FTP (debe ser public_html/colbeef.com).
      # FTP_HOST opcional; si no existe, usa ftp.frigorificoriofrio.com
      - name: Deploy via FTP (lftp)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          FTP_HOST="$(printf '%s' "${FTP_HOST:-ftp.frigorificoriofrio.com}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_SERVER_DIR="$(printf '%s' "${FTP_SERVER_DIR:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s#^/##;s#/$##')"

          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Faltan secrets FTP_USERNAME / FTP_PASSWORD"
            exit 1
          fi

          echo "Host: $FTP_HOST"
          echo "User length: ${#FTP_USER}"
          echo "Pass length: ${#FTP_PASS}"
          echo "Dir length: ${#FTP_SERVER_DIR}"

          CD_LINE="pwd"
          if [ -n "$FTP_SERVER_DIR" ] && [ "$FTP_SERVER_DIR" != "." ]; then
            CD_LINE="cd ${FTP_SERVER_DIR}"
            echo "Will cd to a remote subdirectory"
          else
            echo "Will stay in FTP home"
          fi

          lftp -f /dev/stdin <<EOF
          set cmd:fail-exit yes
          set net:timeout 90
          set net:max-retries 3
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          open -u "${FTP_USER}","${FTP_PASS}" -p 21 ftp://${FTP_HOST}
          ${CD_LINE}
          pwd
          ls
          mirror -R --verbose --parallel=2 ./dist/ .
          ls
          bye
          EOF
