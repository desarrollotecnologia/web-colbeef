name: Deploy to GoDaddy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (raíz colbeef.com)
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_WEB3FORMS_TRABAJE_ACCESS_KEY: ${{ secrets.TRABAJE_CON_NOSOTROS }}
          VITE_WEB3FORMS_HORECA_ACCESS_KEY: ${{ secrets.SOLICITUD_DE_NEGOCIO }}

      - name: Prepare FTP target
        id: ftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          host="$(printf '%s' "${FTP_HOST:-ftp.frigorificoriofrio.com}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          dir="$(printf '%s' "${FTP_SERVER_DIR:-.}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s#^/##;s#/$##')"
          if [ -z "$dir" ] || [ "$dir" = "." ]; then
            remote="./"
          else
            remote="${dir}/"
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "server_dir=$remote" >> "$GITHUB_OUTPUT"
          echo "Host: $host"
          echo "Server dir: $remote"

      # La clave puede traer * @ ! ; esta action no la interpola en un script lftp.
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          security: loose
          timeout: 60000
