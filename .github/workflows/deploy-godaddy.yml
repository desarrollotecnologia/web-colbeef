name: Deploy to GoDaddy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Carpeta de prueba (no toca el WordPress en la raíz de colbeef.com):
      # URL: https://colbeef.com/sitio-nuevo/
      - name: Build (subcarpeta de prueba)
        run: npm run build
        env:
          VITE_BASE_PATH: /sitio-nuevo/
          VITE_WEB3FORMS_TRABAJE_ACCESS_KEY: ${{ secrets.TRABAJE_CON_NOSOTROS }}
          VITE_WEB3FORMS_HORECA_ACCESS_KEY: ${{ secrets.SOLICITUD_DE_NEGOCIO }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # GoDaddy / cPanel: FTPS explícito en puerto 21
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          timeout: 60000
