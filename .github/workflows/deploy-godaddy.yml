name: Deploy to GoDaddy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (subcarpeta de prueba)
        run: npm run build
        env:
          VITE_BASE_PATH: /sitio-nuevo/
          VITE_WEB3FORMS_TRABAJE_ACCESS_KEY: ${{ secrets.TRABAJE_CON_NOSOTROS }}
          VITE_WEB3FORMS_HORECA_ACCESS_KEY: ${{ secrets.SOLICITUD_DE_NEGOCIO }}

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # La cuenta FTP ya entra en su carpeta (chroot).
      # Por eso "cd sitio-nuevo" falla: esa carpeta no existe DENTRO del jail.
      # Subimos al directorio actual tras el login (pwd).
      - name: Deploy via FTPS (lftp + netrc)
        env:
          FTP_HOST: ftp.frigorificoriofrio.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"

          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Faltan secrets FTP_USERNAME / FTP_PASSWORD"
            exit 1
          fi

          echo "Host: $FTP_HOST"
          echo "User length: ${#FTP_USER}"

          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

          lftp -c "
            set cmd:fail-exit yes;
            set net:timeout 60;
            set net:max-retries 2;
            set ftp:passive-mode true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open ftp://${FTP_HOST}:21;
            echo '=== Directorio actual de la cuenta FTP ===';
            pwd;
            ls;
            echo '=== Subiendo dist/ al directorio actual ===';
            mirror -R --verbose --parallel=2 ./dist/ .;
            echo '=== Contenido tras subida ===';
            ls;
            bye
          "
