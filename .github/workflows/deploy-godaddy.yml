name: Deploy to GoDaddy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (raíz colbeef.com)
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_WEB3FORMS_TRABAJE_ACCESS_KEY: ${{ secrets.TRABAJE_CON_NOSOTROS }}
          VITE_WEB3FORMS_HORECA_ACCESS_KEY: ${{ secrets.SOLICITUD_DE_NEGOCIO }}

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # No usar ~/.netrc: contraseñas con @ ! rompen el parseo.
      # Destino: public_html/colbeef.com (raíz de https://colbeef.com/).
      - name: Deploy via FTPS (lftp)
        env:
          FTP_HOST: ftp.frigorificoriofrio.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          FTP_SERVER_DIR="$(printf '%s' "$FTP_SERVER_DIR" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s#^/##;s#/$##')"

          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Faltan secrets FTP_USERNAME / FTP_PASSWORD"
            exit 1
          fi

          echo "Host: $FTP_HOST"
          echo "Remote dir: ${FTP_SERVER_DIR:-.(home FTP)}"
          echo "User length: ${#FTP_USER}"
          echo "Pass length: ${#FTP_PASS}"

          CD_CMD=""
          if [ -n "$FTP_SERVER_DIR" ]; then
            CD_CMD="cd ${FTP_SERVER_DIR}"
          fi

          lftp -f /dev/stdin <<EOF
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 2
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          open -u "${FTP_USER}","${FTP_PASS}" -p 21 ftp://${FTP_HOST}
          ${CD_CMD}
          pwd
          ls
          mirror -R --verbose --parallel=2 ./dist/ .
          ls
          bye
          EOF
