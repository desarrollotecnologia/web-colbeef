name: Deploy to GoDaddy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (subcarpeta de prueba)
        run: npm run build
        env:
          VITE_BASE_PATH: /sitio-nuevo/
          VITE_WEB3FORMS_TRABAJE_ACCESS_KEY: ${{ secrets.TRABAJE_CON_NOSOTROS }}
          VITE_WEB3FORMS_HORECA_ACCESS_KEY: ${{ secrets.SOLICITUD_DE_NEGOCIO }}

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Login OK. La ruta remota depende del "Directorio" de la cuenta FTP en cPanel.
      # Si la cuenta ya apunta a sitio-nuevo → FTP_SERVER_DIR=./
      - name: Deploy via FTPS (lftp + netrc)
        env:
          FTP_HOST: ftp.frigorificoriofrio.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          FTP_DIR="$(printf '%s' "$FTP_DIR" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          # Quitar slash inicial: /public_html/... falla en cuentas enjauladas
          FTP_DIR="${FTP_DIR#/}"

          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ] || [ -z "$FTP_DIR" ]; then
            echo "Faltan secrets FTP_USERNAME / FTP_PASSWORD / FTP_SERVER_DIR"
            exit 1
          fi

          echo "Host: $FTP_HOST"
          echo "User length: ${#FTP_USER}"
          echo "Remote dir (normalized): $FTP_DIR"

          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

          lftp -c "
            set cmd:fail-exit yes;
            set net:timeout 60;
            set net:max-retries 2;
            set ftp:passive-mode true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open ftp://${FTP_HOST}:21;
            pwd;
            ls;
            cd ${FTP_DIR};
            pwd;
            mirror -R --verbose --parallel=2 ./dist/ .;
            bye
          "
